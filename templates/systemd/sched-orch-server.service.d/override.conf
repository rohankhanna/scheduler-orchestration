# Copy to: /etc/systemd/system/sched-orch-server.service.d/override.conf
# Then: systemctl daemon-reload
# Then: systemctl restart sched-orch-server.service

[Service]
# Keep the server responsive.
# (Adjust as needed; do not put the server inside the jobs slice.)
CPUWeight=200
IOWeight=200

# Keep the server out of the workload envelope.
Slice=system.slice
