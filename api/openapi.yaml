openapi: 3.1.0
info:
  title: Scheduler Orchestration Local API
  version: 0.2.0
  summary: Local-first orchestration server API for scheduler-backed job graphs.
  description: |
    Dispatch is a local-first orchestration server for submitting, observing,
    and controlling scheduler-backed job graphs.

    Security posture (iteration 1):
    - Bind to loopback by default.
    - Use user sessions for human/project administration.
    - Use API keys for programmatic job submission.
    - Treat request bodies as untrusted input and validate against schema.
servers:
  - url: http://127.0.0.1:8780
paths:
  /v1/users:
    post:
      operationId: createUser
      summary: Create a new user account.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateUserRequest'
      responses:
        '201':
          description: User created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateUserResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          $ref: '#/components/responses/Conflict'
  /v1/login:
    post:
      operationId: login
      summary: Log in a user and mint a short-lived access token plus refresh token.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Login succeeded.
          headers:
            Set-Cookie:
              description: HttpOnly refresh-token cookie for browser UI clients.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /v1/token/refresh:
    post:
      operationId: refreshSession
      summary: Rotate the refresh token and mint a new access token.
      responses:
        '200':
          description: Session refreshed.
          headers:
            Set-Cookie:
              description: Rotated refresh-token cookie for browser UI clients.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /v1/projects:
    post:
      operationId: createProject
      summary: Create a project/program identity for API-key management.
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateProjectRequest'
      responses:
        '201':
          description: Project created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateProjectResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /v1/projects/{project_id}/api-keys:
    get:
      operationId: listProjectApiKeys
      summary: List API key metadata for a project.
      security:
        - BearerAuth: []
      parameters:
        - name: project_id
          in: path
          required: true
          schema:
            type: string
            minLength: 1
      responses:
        '200':
          description: Key metadata.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListApiKeysResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      operationId: mintProjectApiKey
      summary: Mint a new API key for a project.
      security:
        - BearerAuth: []
      parameters:
        - name: project_id
          in: path
          required: true
          schema:
            type: string
            minLength: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MintApiKeyRequest'
      responses:
        '201':
          description: API key minted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MintApiKeyResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /v1/api-keys/{key_id}:
    delete:
      operationId: revokeApiKey
      summary: Revoke an API key.
      security:
        - BearerAuth: []
      parameters:
        - name: key_id
          in: path
          required: true
          schema:
            type: string
            minLength: 1
      responses:
        '200':
          description: API key revoked.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RevokeApiKeyResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /v1/jobs:
    get:
      operationId: listJobs
      summary: List jobs tracked by the orchestration server (ledger-backed).
      security:
        - ApiKeyAuth: []
      parameters:
        - name: refresh
          in: query
          required: false
          schema:
            type: boolean
          description: When true, query the backend for a bounded set of jobs and persist refreshed state into the ledger before returning the list. Direct backend refresh requires SCHED_ORCH_ENABLE_DIRECT_REFRESH=1. If SCHED_ORCH_ENABLE_DIRECT_STATE_INFERENCE=1 is also set, refresh may update high-level job state based on direct scope state.
      responses:
        '200':
          description: Jobs list.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListJobsResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      operationId: submitJob
      summary: Submit a job specification for scheduler admission.
      security:
        - ApiKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SubmitJobRequest'
      responses:
        '202':
          description: Submission accepted by orchestration server.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubmitJobResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /v1/jobs/{job_id}:
    get:
      operationId: getJob
      summary: Get server-tracked status for one job.
      security:
        - ApiKeyAuth: []
      parameters:
        - name: job_id
          in: path
          required: true
          schema:
            type: string
            minLength: 1
        - name: refresh
          in: query
          required: false
          schema:
            type: boolean
          description: When true, query the backend and persist refreshed state into the ledger. For direct backend this requires SCHED_ORCH_ENABLE_DIRECT_REFRESH=1. If SCHED_ORCH_ENABLE_DIRECT_STATE_INFERENCE=1 is also set, refresh may update the job's high-level state based on scope state.
      responses:
        '200':
          description: Job status.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetJobResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      operationId: cancelJob
      summary: Cancel a job via the active execution backend.
      security:
        - ApiKeyAuth: []
      parameters:
        - name: job_id
          in: path
          required: true
          schema:
            type: string
            minLength: 1
      responses:
        '200':
          description: Cancellation accepted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CancelJobResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /v1/jobs/{job_id}/logs:
    get:
      operationId: getJobLogs
      summary: Get captured logs for a direct backend job.
      security:
        - ApiKeyAuth: []
      parameters:
        - name: job_id
          in: path
          required: true
          schema:
            type: string
            minLength: 1
      responses:
        '200':
          description: Captured stdout/stderr.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetJobLogsResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /v1/queue:
    get:
      operationId: listQueue
      summary: List queued/running jobs from scheduler view.
      security:
        - ApiKeyAuth: []
      responses:
        '200':
          description: Queue snapshot.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QueueResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /v1/drain:
    post:
      operationId: setDrainMode
      summary: Enable or disable operator-level drain mode.
      security:
        - ApiKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SetDrainRequest'
      responses:
        '200':
          description: Drain state updated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SetDrainResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
components:
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  responses:
    BadRequest:
      description: Invalid request.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Unauthorized:
      description: Missing or invalid authentication.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    NotFound:
      description: Resource not found.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Conflict:
      description: Resource conflict.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
  schemas:
    CreateUserRequest:
      type: object
      additionalProperties: false
      required: [username, password]
      properties:
        username:
          type: string
          minLength: 1
        password:
          type: string
          minLength: 8
    CreateUserResponse:
      type: object
      additionalProperties: false
      required: [user_id, username, created_at]
      properties:
        user_id:
          type: string
        username:
          type: string
        created_at:
          type: string
          format: date-time
    LoginRequest:
      type: object
      additionalProperties: false
      required: [username, password]
      properties:
        username:
          type: string
          minLength: 1
        password:
          type: string
          minLength: 1
    LoginResponse:
      type: object
      additionalProperties: false
      required: [access_token, access_expires_at]
      properties:
        access_token:
          type: string
        access_expires_at:
          type: string
          format: date-time
        refresh_token:
          type: string
          description: Included for API clients; browser clients typically rely on the refresh cookie.
        refresh_expires_at:
          type: string
          format: date-time
        user:
          type: object
          additionalProperties: false
          required: [user_id]
          properties:
            user_id:
              type: string
            username:
              type: string
    CreateProjectRequest:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
    CreateProjectResponse:
      type: object
      additionalProperties: false
      required: [project_id, name, created_at]
      properties:
        project_id:
          type: string
        name:
          type: string
        created_at:
          type: string
          format: date-time
    MintApiKeyRequest:
      type: object
      additionalProperties: false
      required: [label]
      properties:
        label:
          type: string
    MintApiKeyResponse:
      type: object
      additionalProperties: false
      required: [key_id, project_id, label, created_at, expires_at, api_key]
      properties:
        key_id:
          type: string
        project_id:
          type: string
        label:
          type: string
        created_at:
          type: string
          format: date-time
        expires_at:
          type: string
          format: date-time
        api_key:
          type: string
    ListApiKeysResponse:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/ApiKeyItem'
    ApiKeyItem:
      type: object
      additionalProperties: false
      required: [key_id, project_id, label, created_at, expires_at]
      properties:
        key_id:
          type: string
        project_id:
          type: string
        label:
          type: string
        created_at:
          type: string
          format: date-time
        expires_at:
          type: string
          format: date-time
    RevokeApiKeyResponse:
      type: object
      additionalProperties: false
      required: [key_id, revoked]
      properties:
        key_id:
          type: string
        revoked:
          type: boolean
    SubmitJobRequest:
      type: object
      additionalProperties: false
      required: [spec]
      properties:
        spec:
          $ref: '#/components/schemas/SchedulerJobSpec'
    ListJobsResponse:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/JobListItem'
    JobListItem:
      type: object
      additionalProperties: false
      required: [server_job_id, state]
      properties:
        server_job_id: { type: string }
        created_at:
          anyOf:
            - type: string
              format: date-time
            - type: 'null'
        state: { type: string }
        scheduler_job_id:
          anyOf:
            - type: string
            - type: 'null'
        execution_backend:
          anyOf:
            - type: string
            - type: 'null'
        accepted:
          anyOf:
            - type: boolean
            - type: 'null'
        reason:
          anyOf:
            - type: string
            - type: 'null'
        spec_sha256:
          anyOf:
            - type: string
            - type: 'null'
        job_name:
          anyOf:
            - type: string
            - type: 'null'
    SubmitJobResponse:
      type: object
      additionalProperties: false
      required: [server_job_id, accepted, reason]
      properties:
        server_job_id:
          type: string
          minLength: 1
        accepted:
          type: boolean
        reason:
          type: string
          enum: [ok, drain_enabled]
        command:
          anyOf:
            - type: array
              items: { type: string }
            - type: 'null'
    CancelJobResponse:
      type: object
      additionalProperties: false
      required: [server_job_id, canceled]
      properties:
        server_job_id:
          type: string
        canceled:
          type: boolean
    GetJobResponse:
      type: object
      additionalProperties: false
      required: [server_job_id, state]
      properties:
        server_job_id:
          type: string
        state:
          type: string
          enum: [accepted, blocked, submitted, running, succeeded, failed, canceled, unknown]
        scheduler_job_id:
          anyOf:
            - type: string
            - type: 'null'
        detail:
          type: object
          additionalProperties: true
    GetJobLogsResponse:
      type: object
      additionalProperties: false
      required: [server_job_id, execution_backend, stdout, stderr]
      properties:
        server_job_id:
          type: string
          minLength: 1
        execution_backend:
          type: string
          description: Currently only direct backend jobs support captured logs.
        stdout:
          type: string
        stderr:
          type: string
    QueueResponse:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/QueueItem'
    QueueItem:
      type: object
      additionalProperties: false
      required: [job_id, name, state]
      properties:
        job_id: { type: string }
        name: { type: string }
        state: { type: string }
        time: { type: string }
        nodes: { type: string }
        cpus: { type: string }
        memory: { type: string }
        reason: { type: string }
    SetDrainRequest:
      type: object
      additionalProperties: false
      required: [enabled]
      properties:
        enabled:
          type: boolean
    SetDrainResponse:
      type: object
      additionalProperties: false
      required: [enabled, updated_at]
      properties:
        enabled: { type: boolean }
        updated_at:
          type: string
          format: date-time
    ErrorResponse:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error:
          type: string
        message:
          type: string
          description: Optional human-readable message (for example, key expiration regeneration instructions).
    SchedulerJobSpec:
      type: object
      additionalProperties: false
      required:
        - job_name
        - workflow_preset
        - device_preference
        - payload
        - resources
        - dependencies
        - environment_overrides
        - artifacts_root
        - retry_policy
        - drain_behavior
      properties:
        job_name:
          type: string
          minLength: 1
        workflow_preset:
          type: string
          minLength: 1
        device_preference:
          type: string
          enum: [gpu, cpu, auto]
        payload:
          type: object
          additionalProperties: false
          required: [argv]
          description: Execution payload argv. Required for Slurm submission, and for direct execution when explicitly enabled.
          properties:
            argv:
              type: array
              minItems: 1
              maxItems: 64
              items:
                type: string
                minLength: 1
        resources:
          type: object
          additionalProperties: false
          required:
            - graphics_processing_units
            - central_processing_unit_cores
            - memory_gibibytes
          properties:
            graphics_processing_units:
              type: integer
              minimum: 0
            central_processing_unit_cores:
              type: integer
              minimum: 1
            memory_gibibytes:
              type: integer
              minimum: 1
        dependencies:
          type: object
          additionalProperties: false
          required: [parents, policy]
          properties:
            parents:
              type: array
              items:
                type: string
                minLength: 1
            policy:
              type: string
              enum: [afterok, afterany]
        environment_overrides:
          type: object
          additionalProperties:
            type: string
        artifacts_root:
          type: string
          minLength: 1
        retry_policy:
          type: object
          additionalProperties: false
          required: [max_attempts]
          properties:
            max_attempts:
              type: integer
              minimum: 1
        drain_behavior:
          type: object
          additionalProperties: false
          required: [honor_drain]
          properties:
            honor_drain:
              type: boolean
