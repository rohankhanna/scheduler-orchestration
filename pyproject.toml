[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dispatch-orchestration"
version = "0.2.0"
description = "Dispatch: local-first orchestration server + operator CLI"
requires-python = ">=3.12"
readme = "README.md"
license = {text = "MIT"}

dependencies = [
  "fastapi>=0.110",
  "uvicorn>=0.27",
  "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "pyyaml>=6",
  "jsonschema>=4",
]

[project.scripts]
dispatch = "dispatch.dispatch:main"

[tool.setuptools]
packages = ["dispatch", "dispatch.server"]
